<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Clock</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="clock" id="clock">
      <h1 class="heading" id="heading"></h1>
      <div class="panels">
        <section class="panel" id="clock-panel">
          <h2 class="title" id="clock-title"></h2>
          <div class="face">
            <svg class="analog" id="analog" viewBox="0 0 200 200" aria-hidden="true">
              <g id="ticks"></g>
              <line class="hand hour" id="hour" x1="100" y1="100" x2="100" y2="54" />
              <line class="hand minute" id="minute" x1="100" y1="100" x2="100" y2="28" />
              <line class="hand second" id="second" x1="100" y1="116" x2="100" y2="22" />
              <circle class="pin" cx="100" cy="100" r="3.5" />
            </svg>

            <div class="digital" id="digital" aria-live="off">
              <div class="time" id="time"><span id="hm"></span><span class="sec" id="sec"></span><span class="ampm" id="ampm"></span></div>
              <div class="date" id="date"></div>
            </div>
          </div>
        </section>

        <section class="panel" id="timer-panel">
          <h2 class="title" id="timer-title"></h2>
          <div class="face">
            <svg class="analog" viewBox="0 0 200 200" aria-hidden="true">
              <g id="timer-ticks"></g>
              <circle class="dial" cx="100" cy="100" r="80" />
              <path class="fill" id="timer-fill" />
              <circle class="fill" id="timer-full" cx="100" cy="100" r="80" />
              <line class="hand timer-hand" id="timer-hand" x1="100" y1="100" x2="100" y2="20" />
              <circle class="pin" cx="100" cy="100" r="3.5" />
            </svg>

            <div class="digital" id="timer-digital" aria-live="off">
              <div class="time" id="timer-time"></div>
              <div class="label" id="timer-label"></div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <nav class="controls" id="controls" aria-label="Clock settings">
      <div class="group" role="group" aria-label="Display" data-setting="mode">
        <button type="button" data-value="digital">Digital</button>
        <button type="button" data-value="analog">Analog</button>
        <button type="button" data-value="both">Both</button>
      </div>

      <div class="group swatches" role="group" aria-label="Theme" data-setting="theme">
        <button type="button" data-value="dark" aria-label="Dark theme"></button>
        <button type="button" data-value="light" aria-label="Light theme"></button>
        <button type="button" data-value="amber" aria-label="Amber theme"></button>
        <button type="button" data-value="ice" aria-label="Ice theme"></button>
      </div>

      <div class="group" role="group" aria-label="Font" data-setting="font">
        <button type="button" data-value="sans">Sans</button>
        <button type="button" data-value="mono">Mono</button>
        <button type="button" data-value="serif">Serif</button>
        <button type="button" data-value="seg">7-Seg</button>
      </div>

      <div class="group" role="group" aria-label="Options">
        <button type="button" data-toggle="h24">24h</button>
        <button type="button" data-toggle="seconds">Seconds</button>
        <button type="button" data-toggle="date">Date</button>
      </div>

      <div class="group">
        <button type="button" id="title-button">Title</button>
        <button type="button" id="timer-button">Timer</button>
      </div>

      <div class="group" role="group" aria-label="Show" data-setting="show" id="show-group">
        <button type="button" data-value="clock">Clock</button>
        <button type="button" data-value="timer">Timer</button>
        <button type="button" data-value="both">Both</button>
      </div>

      <div class="group">
        <button type="button" id="fullscreen">Fullscreen</button>
        <span class="wake" id="wake"></span>
      </div>
    </nav>

    <dialog class="dialog" id="timer-dialog" aria-labelledby="timer-dialog-title">
      <form id="timer-form" novalidate>
        <h2 id="timer-dialog-title">Timer</h2>

        <label>
          Title (optional)
          <input name="title" class="text" placeholder="Pomodoro" autocomplete="off" maxlength="60" />
        </label>

        <label>
          Duration
          <input name="duration" placeholder="25:00" autocomplete="off" />
        </label>
        <div class="presets" id="timer-presets">
          <button type="button" data-minutes="5">5m</button>
          <button type="button" data-minutes="10">10m</button>
          <button type="button" data-minutes="15">15m</button>
          <button type="button" data-minutes="25">25m</button>
          <button type="button" data-minutes="30">30m</button>
          <button type="button" data-minutes="60">1h</button>
        </div>

        <label>
          Already passed
          <input name="elapsed" placeholder="0:00" autocomplete="off" />
        </label>

        <p class="hint">Minutes (25), m:ss (1:30), h:mm:ss, or 1h30m.</p>
        <p class="error" id="timer-error" role="alert"></p>

        <div class="actions">
          <button type="button" id="timer-clear">Clear</button>
          <button type="button" id="timer-pause">Pause</button>
          <span class="spacer"></span>
          <button type="button" id="timer-cancel">Cancel</button>
          <button type="submit" class="primary">Start</button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog" id="title-dialog" aria-labelledby="title-dialog-title">
      <form id="title-form" novalidate>
        <h2 id="title-dialog-title">Titles</h2>

        <label>
          Page title (above both)
          <input name="heading" class="text" placeholder="e.g. Lab test 2 from 8:30am to 9:30am" autocomplete="off" maxlength="100" />
        </label>
        <label>
          Clock title
          <input name="clock" class="text" placeholder="e.g. Current time" autocomplete="off" maxlength="60" />
        </label>
        <label id="timer-title-field">
          Timer title
          <input name="timer" class="text" placeholder="e.g. Time remaining" autocomplete="off" maxlength="60" />
        </label>

        <p class="hint">Leave blank for no title.</p>

        <div class="actions">
          <span class="spacer"></span>
          <button type="button" id="title-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
